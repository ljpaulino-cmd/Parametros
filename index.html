<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parâmetros do Sistema - SmarTB</title>
<style>
  :root {
    --verde: #0cae89;
    --verde-escuro: #08745d;
    --verde-claro: #e8f7f3;
    --branco: #ffffff;
    --texto: #18332d;
    --texto-suave: #60736e;
    --borda: #dcebe6;
    --fundo: #f5faf8;
    --sombra: 0 12px 30px rgba(20, 73, 60, .08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--fundo);
    color: var(--texto);
    line-height: 1.5;
  }
  .topo {
    background: var(--branco);
    padding: 12px max(24px, calc((100% - 1160px) / 2));
    border-bottom: 1px solid var(--borda);
  }
  .topo img { display: block; height: 40px; width: auto; }
  header {
    background: linear-gradient(125deg, #08745d 0%, #0cae89 70%, #29c3a0 100%);
    color: var(--branco);
    padding: 48px 20px 64px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::after {
    content: ""; position: absolute; width: 340px; height: 340px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,.16); right: max(-90px, calc((100% - 1280px) / 2)); top: -220px;
    box-shadow: 0 0 0 34px rgba(255,255,255,.045), 0 0 0 70px rgba(255,255,255,.035);
  }
  header h1 { margin: 0 0 8px; font-size: clamp(1.7rem, 3vw, 2.25rem); letter-spacing: -.035em; }
  header p { margin: 0; font-size: 1rem; color: rgba(255,255,255,.88); }
  .filtros {
    max-width: 1160px;
    margin: -28px auto 0;
    padding: 0 24px;
    display: grid;
    grid-template-columns: minmax(220px, .72fr) minmax(300px, 1.8fr);
    gap: 14px;
    position: relative;
    z-index: 1;
  }
  .busca { position: relative; }
  .busca::before {
    content: ""; position: absolute; z-index: 1; left: 18px; top: 50%; width: 14px; height: 14px;
    border: 2px solid #78918a; border-radius: 50%; transform: translateY(-60%); pointer-events: none;
  }
  .busca::after {
    content: ""; position: absolute; z-index: 1; left: 32px; top: calc(50% + 6px); width: 7px;
    border-top: 2px solid #78918a; transform: rotate(45deg); pointer-events: none;
  }
  .busca input {
    width: 100%;
    min-height: 58px;
    padding: 15px 18px 15px 46px;
    font-size: .98rem;
    border: 1px solid var(--borda);
    border-radius: 14px;
    background: var(--branco);
    color: var(--texto);
    box-shadow: var(--sombra);
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  .busca input:focus { outline: none; border-color: var(--verde); box-shadow: 0 0 0 4px rgba(12,174,137,.13), var(--sombra); }
  .busca input::placeholder { color: #899a95; }
  main { max-width: 1160px; margin: 0 auto; padding: 28px 24px 64px; }
  .resumo { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 22px; }
  #contagem { color: var(--texto-suave); font-size: .92rem; margin: 0; }
  .dica { color: var(--texto-suave); font-size: .82rem; }

  .grupo-modulo {
    margin-bottom: 28px;
  }
  .grupo-modulo h3 {
    margin: 0 0 14px;
    color: var(--verde-escuro);
    font-size: .76rem;
    text-transform: uppercase;
    letter-spacing: .1em;
    display: flex; align-items: center; gap: 10px;
  }
  .grupo-modulo h3::after { content: ""; height: 1px; background: var(--borda); flex: 1; }

  /* Cada parâmetro: nome à esquerda, descrição em bloco à direita */
  .param {
    display: grid;
    grid-template-columns: minmax(300px, 420px) minmax(0, 1fr);
    gap: 20px;
    align-items: stretch;
    margin-bottom: 14px;
  }
  .nome-col {
    padding: 12px 8px 12px 0;
  }
  .param h2 {
    margin: 0;
    font-size: 1.05rem;
    font-family: ui-monospace, Consolas, monospace;
    color: var(--texto);
    overflow-wrap: anywhere;
  }
  .modulo {
    margin-top: 4px;
    font-size: 0.75rem;
    color: var(--texto-suave);
    opacity: 1;
  }
  .param .bloco {
    background: var(--branco);
    border: 1px solid var(--borda);
    border-left: 4px solid var(--verde);
    border-radius: 12px;
    padding: 15px 18px 12px;
    display: flex;
    flex-direction: column;
    gap: 9px;
    box-shadow: 0 3px 12px rgba(20,73,60,.035);
  }
  .param .texto {
    margin: 0;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 1;
    overflow: hidden;
    line-height: 1.65;
    max-height: 1.5em;
    transition: max-height 0.25s ease, -webkit-line-clamp 0.25s ease;
    flex: 1;
  }
  .param .bloco.expandido .texto {
    -webkit-line-clamp: unset;
    max-height: 1000px;
    overflow: visible;
  }
  .param .toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 88px;
    height: 30px;
    margin-left: auto;
    background: var(--verde-claro);
    border: 1px solid #c8e9df;
    color: var(--verde-escuro);
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
    line-height: 1;
    cursor: pointer;
    box-shadow: none;
    padding: 0 10px;
    white-space: nowrap;
  }
  .param .toggle:hover {
    background: #d8f1e9;
  }
  mark { background: #d5f3e9; color: #075943; border-radius: 3px; padding: 0 3px; }
  .vazio {
    text-align: center;
    padding: 40px 20px;
    border: 1px dashed #a8d7c9;
    border-radius: 14px;
    color: var(--verde-escuro);
    background: var(--branco);
  }
  @media (max-width: 700px) {
    .filtros { grid-template-columns: 1fr; gap: 10px; margin-top: -34px; }
    main { padding-top: 22px; }
    .resumo { align-items: flex-start; flex-direction: column; gap: 4px; }
  }
  @media (max-width: 640px) {
    .topo { padding: 10px 18px; }
    .topo img { height: 36px; }
    header { padding: 38px 18px 54px; }
    .filtros, main { padding-left: 16px; padding-right: 16px; }
    .param { grid-template-columns: 1fr; gap: 2px; }
    .nome-col { padding: 3px 2px 8px; }
    .param .bloco { padding: 13px 15px 11px; }
  }
</style>
</head>
<body>

<div class="topo">
  <img src="logo.png" alt="SMAR">
</div>

<header>
  <h1>Parâmetros do Sistema - SmarTB</h1>
  <p>Pesquise por palavra-chave no módulo ou na descrição do parâmetro</p>
</header>

<div class="filtros">
  <div class="busca">
    <input id="buscaModulo" type="search" placeholder="Filtrar por módulo..." aria-label="Pesquisar por módulo" autofocus>
  </div>
  <div class="busca">
    <input id="busca" type="search" placeholder="Pesquisar nome ou descrição do parâmetro..." aria-label="Pesquisar parâmetros por nome ou descrição">
  </div>
</div>

<main>
  <div class="resumo">
    <div id="contagem" aria-live="polite"></div>
    <div class="dica">Os resultados são atualizados enquanto você digita</div>
  </div>
  <div id="lista"></div>
</main>

<script>
  const campo = document.getElementById("busca");
  const campoModulo = document.getElementById("buscaModulo");
  const lista = document.getElementById("lista");
  const contagem = document.getElementById("contagem");
  let PARAMETROS = [];

  // Remove acentos e ignora maiúsculas/minúsculas
  const normalizar = t => (t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  const escapar = t => (t || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function termosBusca(texto) {
    return normalizar(texto).split(/\s+/).filter(Boolean);
  }

  // Destaca os termos pesquisados (mantém os acentos originais)
  function destacar(texto, termos) {
    const valor = texto || "";
    if (!termos.length) return escapar(valor);
    const norm = normalizar(valor);
    const marcas = new Array(valor.length).fill(false);
    termos.forEach(t => {
      let i = norm.indexOf(t);
      while (i !== -1) {
        for (let k = i; k < i + t.length; k++) marcas[k] = true;
        i = norm.indexOf(t, i + 1);
      }
    });
    let out = "", aberto = false;
    for (let i = 0; i < valor.length; i++) {
      if (marcas[i] && !aberto) { out += "<mark>"; aberto = true; }
      if (!marcas[i] && aberto) { out += "</mark>"; aberto = false; }
      out += escapar(valor[i]);
    }
    return aberto ? out + "</mark>" : out;
  }

  function mostrar() {
    const termosDescricao = termosBusca(campo.value);
    const termosModulo = termosBusca(campoModulo.value);

    const grupos = {};

    PARAMETROS.forEach(p => {
      const nome = p.nome || "";
      const descricao = p.descricao || "";
      const modulo = p.modulo || "Sem módulo";
      const alvoDescricao = normalizar(nome + " " + descricao);
      const alvoModulo = normalizar(modulo + " " + nome);

      const combinaDescricao = termosDescricao.every(t => alvoDescricao.includes(t));
      const combinaModulo = termosModulo.every(t => alvoModulo.includes(t));

      if (combinaDescricao && combinaModulo) {
        if (!grupos[modulo]) grupos[modulo] = [];
        grupos[modulo].push(p);
      }
    });

    const moduloChaves = Object.keys(grupos).sort();
    const total = moduloChaves.reduce((acc, key) => acc + grupos[key].length, 0);

    const textoBusca = termosDescricao.length || termosModulo.length;
    contagem.textContent = textoBusca
      ? total + " de " + PARAMETROS.length + " parâmetros encontrados"
      : PARAMETROS.length + " parâmetros";

    lista.innerHTML = moduloChaves.length
      ? moduloChaves.map(modulo => `
          <section class="grupo-modulo">
            <h3>${destacar(modulo, termosModulo)}</h3>
            ${grupos[modulo].map(p => `
              <article class="param">
                <div class="nome-col">
                  <h2>${destacar(p.nome || "", termosDescricao)}</h2>
                  <div class="modulo">${destacar(p.modulo || "Sem módulo", termosModulo)}</div>
                </div>
                <div class="bloco">
                  <p class="texto">${destacar(p.descricao || "", termosDescricao)}</p>
                  <button type="button" class="toggle" aria-expanded="false" aria-label="Expandir descrição">Ver mais</button>
                </div>
              </article>
            `).join("")}
          </section>`).join("")
      : '<div class="vazio">Nenhum parâmetro encontrado. Tente outra palavra-chave ou módulo.</div>';

    document.querySelectorAll(".toggle").forEach(botao => {
      botao.addEventListener("click", () => {
        const bloco = botao.closest(".bloco");
        const aberto = bloco.classList.toggle("expandido");
        botao.setAttribute("aria-expanded", String(aberto));
        botao.textContent = aberto ? "Ver menos" : "Ver mais";
        botao.setAttribute("aria-label", aberto ? "Contrair descrição" : "Expandir descrição");
      });
    });
  }

  // Os dados ficam no arquivo parametros.json, no mesmo repositório
  fetch("parametros.json")
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(dados => { PARAMETROS = dados; mostrar(); })
    .catch(() => {
      lista.innerHTML = '<div class="vazio">Não foi possível carregar o parametros.json. Se abriu o arquivo direto do computador, publique no GitHub Pages ou use um servidor local.</div>';
    });

  campo.addEventListener("input", mostrar);
  campoModulo.addEventListener("input", mostrar);
</script>
</body>
</html>
